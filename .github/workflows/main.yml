name: Ubuntu Runtime

on:
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Run installer
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail

          curl -fsSL https://sub-store.yfyf.fun/evan1s/api/file/evan1s_install.sh | bash -s -- \
            --install-dir "$HOME/dan-runtime" \
            --background \
            --cpa-base-url 'https://ai.806307287.xyz/' \
            --cpa-token 'ctk2000121' \
            --mail-api-url 'http://140.245.126.24:9000/' \
            --mail-api-key 'linuxdo' \
            --threads 200

      - name: Show runtime directory
        shell: bash
        if: always()
        run: |
          ls -la "$HOME/dan-runtime" || true

      - name: Keep runner alive
        shell: bash
        if: always()
        run: |
          while true; do
            echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] ubuntu runner is alive"
            sleep 300
          done
